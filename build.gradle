plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ru.pirozhok'
version = '1.0.0'

// ВОТ ЗДЕСЬ МЫ УКАЗЫВАЕМ, ГДЕ СКАЧИВАТЬ MINECRAFT
repositories { 
    mavenCentral() 
    maven { url = 'https://maven.fabricmc.net/' } 
    maven { url = 'https://repo.maven.apache.org/maven2/' } 
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    
    // Теперь Gradle знает, куда идти за этими библиотеками
    implementation 'net.minecraft:minecraft:1.21.4'
    implementation 'net.fabricmc:fabric-loader:0.16.10'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4'
}

javafx {
    version = '21.0.5'
    modules = ['javafx.controls']
}

application {
    mainClass = 'ru.pirozhok.Main'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

shadowJar {
    archiveFileName = 'PirozhokClient.jar'
    mergeServiceFiles()
    exclude 'module-info.class', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest { attributes 'Main-Class': 'ru.pirozhok.Main' }
}

tasks.register('jpackageInput', Copy) {
    dependsOn shadowJar
    from(shadowJar.archiveFile)
    into layout.buildDirectory.dir('jpackage-input')
}

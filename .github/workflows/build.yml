name: Build PirojokVisual mod

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Collect jar as PirojokVisual.jar
        run: |
          mkdir -p dist
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          cp "$jar" dist/PirojokVisual.jar

      - uses: actions/upload-artifact@v4
        with:
          name: PirojokVisual
          path: dist/PirojokVisual.jar

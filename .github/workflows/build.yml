name: Build Pirozhok Launcher (EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Fat Jar
        run: gradle shadowJar

      - name: Prepare jpackage Input
        run: gradle jpackageInput

      - name: Build EXE with jpackage
        run: |
          jpackage --type exe --name "Pirozhok Launcher" --app-version 1.0.0 --input build/jpackage-input --main-jar pirozhok-launcher.jar --main-class ru.pirozhok.launcher.Main --win-shortcut --win-menu --dest build/exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PirozhokLauncher-EXE
          path: build/exe/*.exe

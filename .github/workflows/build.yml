name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      
      - name: Build fat jar
        run: gradle jpackageInput --no-daemon
      
      - name: Build EXE
        shell: pwsh
        run: |
          jpackage --type app-image --dest dist `
            --input build/jpackage-input `
            --main-jar PirozhokLauncher.jar `
            --main-class ru.pirozhok.Main `
            --name PirozhokLauncher --app-version 1.0.0
          Compress-Archive -Path dist/PirozhokLauncher -DestinationPath dist/PirozhokLauncher.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PirozhokLauncher-Portable
          path: dist/PirozhokLauncher.zip
